  <head>
    <meta charset="UTF-8" />
    <script>
      // Runtime constraint: HMR is disabled in cloud iframe environment, ignore WebSocket errors
      window.addEventListener(
        'error',
        function (e) {
          var msg = e && (e.message || (e.error && e.error.message)) ? String(e.message || e.error.message) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        },
        true
      );
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && e.reason ? String(e.reason.message || e.reason) : '';
        if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1) {
          e.preventDefault && e.preventDefault();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
        }
      });
    </script>
